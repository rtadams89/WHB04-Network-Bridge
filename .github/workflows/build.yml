name: Build firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach binaries to releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the firmware version comes from `git describe`

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          command: >-
            idf.py build &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin -o whb04-bridge-full.bin @flash_args

      - name: Collect binaries
        run: |
          mkdir dist
          cp build/whb04-bridge-full.bin dist/whb04-bridge-full.bin
          cp build/whb04-bridge.bin dist/whb04-bridge-ota.bin
          cd dist && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: whb04-bridge-firmware
          path: dist/
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
